name: build_and_test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]

    steps:
      - uses: actions/checkout@v6
        with:
          # Need to clone everything for the git tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "setup.cfg"
          allow-prereleases: true

      - name: Update pip/wheel infrastructure
        shell: bash -l {0}
        run: |
          pip install --upgrade pip uv
          uv pip install --system wheel

      - name: Install cryptography package for moto
        run: |
          uv pip install --system cryptography

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libyaml-dev

      - name: Install pytest packages
        run: |
          uv pip install --system pytest

      - name: Build and install
        run: |
          uv pip install --system -v -e .

      - name: List installed packages
        run: |
          pip list -v

      - name: Run tests
        run: |
          pytest -r a -v src/starlink/ast/test/test.py

  pypi_sdist_build:
    runs-on: ubuntu-latest
    needs: [build_and_test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "setup.cfg"

      - name: Install dependencies
        run: |
          pip install --upgrade setuptools wheel build

      - name: Build and create distribution
        run: |
          python -m build --sdist

      - name: Upload source dist to staging area
        uses: actions/upload-artifact@v5
        with:
          name: pyast-sdist
          path: dist/*

  pypi_wheel_build:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        # For now skip 315t since for true 315t support we need to make
        # many changes.
        python-version: ["311", "312", "313", "314", "315"]
    runs-on: ${{ matrix.os }}
    needs: [build_and_test]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CIBW_BUILD: "cp${{ matrix.python-version }}-{manylinux_x86_64,manylinux_aarch64,macosx_arm64,macosx_x86_64}"
      CIBW_ARCHS_MACOS: "x86_64 arm64"
      CIBW_ARCHS_LINUX: "auto aarch64"

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
        with:
          platforms: arm64

      - uses: actions/checkout@v6
        with:
          # Need to clone everything to embed the version
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install --system --upgrade setuptools wheel cibuildwheel

      - name: Build and create distribution
        run: |
          python -m cibuildwheel --output-dir dist
      - name: Upload built artifacts to staging area
        uses: actions/upload-artifact@v5
        with:
          name: pyast-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*

  pipy_upload:
    needs: [pypi_sdist_build, pypi_wheel_build]
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: pyast-*
          merge-multiple: true
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
